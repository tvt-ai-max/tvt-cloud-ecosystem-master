version: "3.8"

services:
  gateway:
    image: nginx:1.25-alpine
    container_name: tvt-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8090}:80"
      - "127.0.0.1:${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      scanner:
        condition: service_healthy
      billing:
        condition: service_healthy
      concierge:
        condition: service_healthy
      review:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 100M
    networks:
      - tvt-net

  scanner:
    build:
      context: https://github.com/tvt-ai-max/tvt-web-scanner-60s.git
    container_name: tvt-scanner
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - PORT=3000
    volumes:
      - scanner-pdfs:/app/pdfs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 800M
    networks:
      - tvt-net

  billing:
    build:
      context: https://github.com/tvt-ai-max/tvt-vietqr-auto-billing.git
    container_name: tvt-billing
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3001"
    env_file:
      - .env.production
    environment:
      - PORT=3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 250M
    networks:
      - tvt-net

  concierge:
    build:
      context: https://github.com/tvt-ai-max/tvt-smart-concierge-rag.git
    container_name: tvt-concierge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3002"
    env_file:
      - .env.production
    environment:
      - PORT=3002
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 350M
    networks:
      - tvt-net

  review:
    build:
      context: https://github.com/tvt-ai-max/tvt-review-booster.git
    container_name: tvt-review-booster
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3003"
    env_file:
      - .env.production
    environment:
      - PORT=3003
      - DATA_DIR=/app/data
    volumes:
      - review-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 200M
    networks:
      - tvt-net

  redis:
    image: redis:7-alpine
    container_name: tvt-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 150M
    networks:
      - tvt-net

volumes:
  scanner-pdfs:
    driver: local
  review-data:
    driver: local
  redis-data:
    driver: local

networks:
  tvt-net:
    driver: bridge
